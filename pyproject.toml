[project]
name = "speckle-mcp"
version = "0.1.0"
description = "Read-only Model Context Protocol server for Speckle (AEC data hub)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zohar Tito" }]
keywords = ["speckle", "mcp", "aec", "bim", "architecture", "graphql", "rhino", "revit"]
dependencies = [
    "mcp>=2.0.0",
    "specklepy>=2026.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
speckle-mcp = "speckle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speckle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
